version: 2

models:
  - name: int_dex_swap
    description: >
      One row per swap, reoriented to the trader's perspective:
    columns:
      - name: tx_hash
        description: Transaction hash that emitted the Swap (lowercase hex).
        tests:
          - not_null
      - name: log_index
        description: Log position within the transaction. With tx_hash forms the natural key.
        tests:
          - not_null
      - name: direction
        description: >
          Trade direction derived from the pool's signed amounts —
          'token0_to_token1' or 'token1_to_token0'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['token0_to_token1', 'token1_to_token0']
      - name: token_in_symbol
        description: Token the trader SOLD to the pool (DAI or USDC for the default pool).
        tests:
          - not_null
      - name: token_out_symbol
        description: Token the trader BOUGHT from the pool (USDC or DAI for the default pool).
        tests:
          - not_null
      - name: amount_in
        description: Always-positive amount of token_in_symbol, in human units.
        tests:
          - not_null
      - name: amount_out
        description: Always-positive amount of token_out_symbol, in human units.
        tests:
          - not_null
      - name: price_token1_per_token0
        description: >
          Pool price at execution (USDC per DAI for the default pool), decoded
          from sqrtPriceX96 and rescaled for token decimals. ≈ 1.0 for a stable pair.
        tests:
          - not_null
