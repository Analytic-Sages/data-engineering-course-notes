services:
  # Configure log printer to output raw TTY strings
  # so that 'docker compose up indexer' renders the Envio TUI instantly.
  # (Requires docker compose v2)
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${ENVIO_PG_DATABASE:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres} -d ${ENVIO_PG_DATABASE:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my-proxy-net

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "8081:8080"
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER}:${ENVIO_PG_PASSWORD}@db:5432/${ENVIO_PG_DATABASE}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    env_file:
      - .env
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-proxy-net

  indexer:
    build: .
    ports:
      - "8083:8081"
    tty: true
    stdin_open: true
    environment:
      ENVIO_PG_HOST: ${ENVIO_PG_HOST}
      ENVIO_PG_PORT: ${ENVIO_PG_PORT}
      ENVIO_PG_USER: ${ENVIO_PG_USER}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD}
      ENVIO_PG_DATABASE: ${ENVIO_PG_DATABASE}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA}
      ENVIO_HASURA_HOST: graphql-engine
      ENVIO_HASURA_PORT: 8080
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
    networks:
      - my-proxy-net

volumes:
  db_data:

networks:
  my-proxy-net:
    name: envio_network  # analytic_network
